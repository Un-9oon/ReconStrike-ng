[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconstrike"
dynamic = ["version"]
description = "Advanced Web & Network Vulnerability Assessment Framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "CypherSec", email = "cyphersec.404@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
]
dependencies = [
    "requests[socks]>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "urllib3>=2.0.0",
    "colorama>=0.4.6",
    "dnspython>=2.4.0",
    "fpdf2>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "flake8", "mypy", "black"]

[project.scripts]
reconstrike = "reconstrike:main"

[project.urls]
Homepage = "https://github.com/cyphersec-404/ReconStrike"
Repository = "https://github.com/cyphersec-404/ReconStrike"
Issues = "https://github.com/cyphersec-404/ReconStrike/issues"

[tool.setuptools.dynamic]
version = { attr = "scanner.__version__" }

[tool.setuptools.packages.find]
include = ["scanner*"]
