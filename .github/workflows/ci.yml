name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python --version
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip list
      - name: Run tests
        run: python -m pytest --cov=scanner --cov-report=xml -v --tb=long 2>&1 || { echo "::error::Tests failed"; python -m pytest --co -q 2>&1; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 scanner/ reconstrike_ng.py --max-line-length=120 --ignore=E501,W503,E402,F401,F841,F541,E302,E303,E741,W293,E127,E231,E226
